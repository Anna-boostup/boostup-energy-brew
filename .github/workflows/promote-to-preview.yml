name: "🔄 Promote to Preview (Staging)"

on:
  workflow_run:
    workflows: ["🧪 BoostUp Test Pipeline"]
    types:
      - completed
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-to-preview
  cancel-in-progress: false

jobs:
  Promote-to-Preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: "🔄 Promote to Preview"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
      - name: Merge Development into Preview
        run: |
          # Ensure branches are available
          git fetch origin development preview
          
          # Checkout preview and ensure it is up to date
          git checkout preview
          git reset --hard origin/preview
          
          # Merge the development branch into preview
          git merge origin/development --no-ff -m "chore: promote development to preview via automatic trigger"
          
          # Push the changes
          git push origin preview

          # Manually trigger the preview pipeline via GitHub CLI because GITHUB_TOKEN pushes don't trigger push events
          gh workflow run preview-deploy.yml --ref preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
