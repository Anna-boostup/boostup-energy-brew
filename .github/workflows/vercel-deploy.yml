name: Vercel Deploy

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
      - development

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # PREVIEW DEPLOY (development branch)
  # ─────────────────────────────────────────────────────────────────────────────
  Deploy-Preview:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E TESTS after preview deploy
  # ─────────────────────────────────────────────────────────────────────────────
  E2E-Tests:
    runs-on: ubuntu-latest
    needs: Deploy-Preview
    if: github.ref == 'refs/heads/development'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for deployment to become stable
        run: sleep 15

      - name: Run Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.Deploy-Preview.outputs.preview_url }}
        run: npx playwright test tests/smoke.spec.ts --reporter=github

      - name: Run Form Validation Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.Deploy-Preview.outputs.preview_url }}
        run: npx playwright test tests/form_validation.spec.ts --reporter=github

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # PRODUCTION DEPLOY (main branch)
  # ─────────────────────────────────────────────────────────────────────────────
  Deploy-Production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
