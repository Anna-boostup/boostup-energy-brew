name: "🧪 BoostUp Test Pipeline"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. DEPLOY TO TEST (test.drinkboostup.cz)
  Deploy-to-Test:
    name: "🧪 Deploy to Test"
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.49.1-noble
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Auto-bump patch version (development)
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Bumped to v$NEW_VERSION"
          git add package.json package-lock.json
          git commit -m "chore(release): v$NEW_VERSION [skip ci]" || echo "nothing to commit"
          git push origin HEAD:development || echo "push skipped (non-fatal)"

      - name: Install Dependencies
        run: |
          npm ci
          npm install --global vercel@latest
          
      - name: Static Analysis (Lint & TypeCheck)
        run: |
          npm run lint
          npm run typecheck:ci

      - name: Unit Tests (Vitest)
        run: npm run test
        
      - name: Pull Vercel Env
        run: vercel pull --yes --environment=development --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
        
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_PREVIEW }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_PREVIEW }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          
      - name: "Diagnostics: what will be uploaded"
        continue-on-error: true
        run: |
          echo "commit: $(git rev-parse --short HEAD)"
          echo "--- Vercel project settings (.vercel/project.json, settings only)"
          node -e "const p=require('./.vercel/project.json');console.log(JSON.stringify(p.settings||{},null,2))" || true
          echo "--- dist/ vs .vercel/output/static"
          ls dist/assets 2>/dev/null | grep -E '^(index|CheckoutPage)-' || echo "no dist/assets"
          ls .vercel/output/static/assets 2>/dev/null | grep -E '^(index|CheckoutPage)-' || echo "no .vercel/output/static/assets"
          for f in dist/assets/CheckoutPage-*.js .vercel/output/static/assets/CheckoutPage-*.js; do [ -f "$f" ] && echo "$f checkout-terms=$(grep -c checkout-terms "$f")"; done
          echo "--- .vercel/output/static/index.html script"
          grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' .vercel/output/static/index.html || true
          echo "--- .vercel/output/config.json"
          head -c 1500 .vercel/output/config.json 2>/dev/null || true

      - name: Deploy to Test
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }} | tail -n 1)
          echo "Deployment created: $DEPLOYMENT_URL"
          echo "RAW_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          vercel alias set $DEPLOYMENT_URL test.drinkboostup.cz --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
          # Keep the www.* alias in sync too (Stripe webhook may target www.test.*); tolerate a missing domain
          vercel alias set $DEPLOYMENT_URL www.test.drinkboostup.cz --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }} || echo "www.test.drinkboostup.cz alias not configured — skipping"
          echo "DEPLOYMENT_URL=https://test.drinkboostup.cz" >> $GITHUB_ENV
          echo "url=https://test.drinkboostup.cz" >> $GITHUB_OUTPUT

      - name: Wait for 200 OK
        run: |
          timeout 120s bash -c 'until curl -sI -L -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" "$DEPLOYMENT_URL" | grep "200" > /dev/null; do sleep 5; done'
          
      - name: "Diagnostics: what is live"
        continue-on-error: true
        run: |
          for u in "$RAW_DEPLOYMENT_URL" https://test.drinkboostup.cz; do
            [ -z "$u" ] && continue
            idx=$(curl -s -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" "$u/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            chk=$(curl -s -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" "$u$idx" | grep -oE 'CheckoutPage-[A-Za-z0-9_-]+\.js' | head -1)
            echo "$u -> $idx -> $chk"
          done

      # Browsers are pre-installed in the container, but we ensure chromium for our tests
      - name: Ensure Browsers
        run: npx playwright install chromium

      - name: Run E2E Tests
        run: npx playwright test tests/smoke.spec.ts tests/form_validation.spec.ts tests/checkout_scenarios.spec.ts tests/admin.spec.ts tests/mobile.spec.ts tests/admin-mobile.spec.ts tests/payment_e2e.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ env.DEPLOYMENT_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_BASIC_EMAIL: ${{ secrets.TEST_BASIC_EMAIL }}
          TEST_BASIC_PASSWORD: ${{ secrets.TEST_BASIC_PASSWORD }}
          TEST_COMPANY_EMAIL: ${{ secrets.TEST_COMPANY_EMAIL }}
          TEST_COMPANY_PASSWORD: ${{ secrets.TEST_COMPANY_PASSWORD }}
          IS_TEST_MODE: "true"

      - name: Notify on Success (Slack)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"✅ *TEST DEPLOYED SUCCESSFULLY!*\nUrl: https://test.drinkboostup.cz\nTests passed. Ready for promote to preview.\"}" ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on Failure (Slack)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"🚨 *CI/CD PIPELINE FAILED!* (Deploy to Test)\nBranch: ${{ github.ref }}\nCheck results: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.SLACK_WEBHOOK_URL }}

  Trigger-Preview:
    needs: Deploy-to-Test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Promote to Preview
        run: gh workflow run promote-to-preview.yml --ref development --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
