name: "🚀 BoostUp Production Pipeline"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy-Production:
    name: "🚀 Deploy Production"
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.49.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: |
          npm ci
          npm install --global vercel@latest
      - name: Typecheck API (Vercel Serverless)
        run: npm run lint:api
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ env.VERCEL_ORG_ID }}

      - name: Ensure Browsers
        run: npx playwright install chromium

      - name: Production Smoke Test
        run: npx playwright test tests/smoke.spec.ts --project=smoke-desktop
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://drinkboostup.cz
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Notify on Success (Slack)
        if: success()
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory '*'
          if [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && [ -n "$EVENT_BEFORE" ]; then
            LOG=$(git log --no-merges --pretty=format:"• %s" $EVENT_BEFORE..$SHA || git log -1 --pretty=format:"• %s")
          else
            LOG=$(git log -1 --pretty=format:"• %s")
          fi
          
          if [ -z "$LOG" ]; then
            LOG="• Nasazení bez popisu (force-push nebo prázdný merge)"
          fi
          
          export LOG
          node -e "
            const fs = require('fs');
            const text = '✅ *PRODUKCE ÚSPĚŠNĚ NASAZENA!*\\nWeb: https://drinkboostup.cz/\\n\\n*Co je nového v této verzi:*\\n' + process.env.LOG;
            fs.writeFileSync('slack_payload.json', JSON.stringify({ text }));
          "
          curl -X POST -H 'Content-type: application/json' -d @slack_payload.json ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on Failure (Slack)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"🔥 *PRODUCTION DEPLOY FAILED!*\nCheck results: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" ${{ secrets.SLACK_WEBHOOK_URL }}

  Performance-Audit:
    name: "📊 Performance Audit (Production)"
    runs-on: ubuntu-latest
    needs: [Deploy-Production]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Audit Production URL
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://drinkboostup.cz/
          configPath: .github/lighthouse/lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ./lighthouse-budget.json
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
